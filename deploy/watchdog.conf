# Drop-in for /etc/systemd/system.conf.d/watchdog.conf
#
# The Pi has a BCM2835 hardware watchdog that is off by default. systemd pets it
# every RuntimeWatchdogSec/2; if the kernel locks up hard enough that systemd
# stops being scheduled, the chip resets the board. This is the only layer that
# survives a failure no userspace supervisor can — a kernel deadlock, a driver
# hang, an out-of-memory freeze.
#
# The hardware timeout maxes out at 15s on this chip, so don't raise this above
# it; systemd clamps to what the device reports.
[Manager]
RuntimeWatchdogSec=14s
# If a clean reboot wedges (a service refusing to stop), reset anyway.
RebootWatchdogSec=2min
