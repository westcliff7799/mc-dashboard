# Drop-in for /etc/sysctl.d/99-panic-reboot.conf
#
# Default is kernel.panic=0, which means "halt forever and wait for a human".
# On a headless Pi nobody is watching, so a panic at 3am is downtime until
# somebody physically power-cycles it. Reboot instead.
kernel.panic = 10

# Treat an oops as a panic. An oops leaves the kernel in a state it does not
# claim to understand; carrying on from there tends to produce a half-working
# machine that is harder to diagnose than a clean reboot.
kernel.panic_on_oops = 1
